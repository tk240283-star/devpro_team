<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>環境モニタリングダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div id="effect-area"></div>

<div id="wrapper">
    <h1>環境モニタリングシステム</h1>
   
    <h2>◆ 現在の状況</h2>
    <div id="status-msg" class="info-box">データを読み込んでいます...</div>
   
    <h2>◆ 日別平均データ</h2>
    <div id="daily-avg" class="info-box">計算中...</div>
   
    <h2>◆ 温湿度別グラフ</h2>
    <div class="info-box">
        <canvas id="myChart"></canvas>
    </div>
    
    <h2>◆ データ一覧</h2>
    <div class="table-scroll">
        <table>
            <thead>
                <tr>
                    <th>観測日時</th>
                    <th>温度 (℃)</th>
                    <th>湿度 (%)</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
